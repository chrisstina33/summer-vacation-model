<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jurnal de vacanță 2026</title>
<style>
:root {
    --bg-color: #f7f1e5;
    --card-bg: #ffffff;
    --text-primary: #3c302a;
    --text-secondary: #7a6b63;
    --accent-color: #d4835c;
    --accent-hover: #bc6e48;
    --border-color: #e5d8c5;
    --shadow: 0 10px 25px rgba(60, 48, 42, 0.08);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background-color: var(--bg-color);
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23e2d3bc' fill-opacity='0.25' fill-rule='evenodd'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overflow-y: auto;
}

.app-container {
    width: min(92vw, 900px);
    max-height: 90vh;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
}

header {
    padding: clamp(1.2rem, 3vw, 2rem);
    background: linear-gradient(135deg, rgba(212, 131, 92, 0.1), rgba(230, 161, 92, 0.1));
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
}

.header-title h1 {
    font-size: clamp(1.4rem, 3vw, 1.8rem);
    font-weight: 500;
    letter-spacing: -0.5px;
    color: var(--text-primary);
}

.header-title p {
    font-size: clamp(0.85rem, 1.5vw, 0.95rem);
    color: var(--text-secondary);
    margin-top: 0.2rem;
}

.btn {
    background-color: var(--accent-color);
    color: white;
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 30px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: 0 4px 12px rgba(212, 131, 92, 0.3);
}

.btn:hover {
    background-color: var(--accent-hover);
}

.btn:active {
    transform: scale(0.98);
}

.content-scroll {
    padding: clamp(1rem, 3vw, 2rem);
    overflow-y: auto;
    flex: 1;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: clamp(1.5rem, 3vw, 2.5rem);
    padding-bottom: 1rem;
}

.polaroid {
    background: var(--card-bg);
    padding: 12px 12px 20px 12px;
    border-radius: 4px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
    position: relative;
    display: flex;
    flex-direction: column;
}

.polaroid:nth-child(odd) {
    transform: rotate(1deg);
}

.polaroid:nth-child(even) {
    transform: rotate(-1deg);
}

.polaroid:hover {
    transform: translateY(-5px) rotate(0deg) scale(1.01);
    box-shadow: 0 14px 30px rgba(0,0,0,0.1);
    z-index: 10;
}

.polaroid-img-container {
    width: 100%;
    height: 200px;
    background-color: #f0e6d6;
    overflow: hidden;
    position: relative;
    border-radius: 2px;
}

.polaroid-img-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.polaroid-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    font-size: 2.5rem;
}

.polaroid-caption {
    padding-top: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
}

.location-tag {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-color);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.3rem;
}

.memory-desc {
    font-size: 0.9rem;
    color: var(--text-primary);
    line-height: 1.4;
    word-break: break-word;
}

.memory-date {
    font-size: 0.7rem;
    color: var(--text-secondary);
    margin-top: 0.2rem;
    text-align: right;
}

.delete-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    font-size: 0.8rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
}

.polaroid:hover .delete-btn {
    opacity: 1;
}

.delete-btn:hover {
    background: rgba(200, 50, 50, 0.8);
}

.empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-secondary);
}

.empty-state span {
    font-size: 3rem;
    display: block;
    margin-bottom: 1rem;
}

.modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(60, 48, 42, 0.4);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
}

.modal-backdrop.active {
    opacity: 1;
    pointer-events: auto;
}

.modal {
    background: var(--card-bg);
    width: min(90vw, 450px);
    padding: clamp(1.5rem, 3vw, 2rem);
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    transform: translateY(20px);
    transition: transform 0.2s ease;
}

.modal-backdrop.active .modal {
    transform: translateY(0);
}

.modal h2 {
    font-size: 1.25rem;
    font-weight: 500;
    margin-bottom: 1.2rem;
    color: var(--text-primary);
}

.form-group {
    margin-bottom: 1rem;
}

.form-group label {
    display: block;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    margin-bottom: 0.4rem;
}

.form-control {
    width: 100%;
    padding: 0.7rem;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--text-primary);
    background: #faf8f5;
    transition: border-color 0.2s;
}

.form-control:focus {
    outline: none;
    border-color: var(--accent-color);
    background: #fff;
}

textarea.form-control {
    resize: vertical;
    min-height: 80px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.8rem;
    margin-top: 1.5rem;
}

.btn-secondary {
    background-color: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    box-shadow: none;
}

.btn-secondary:hover {
    background-color: rgba(0,0,0,0.03);
    color: var(--text-primary);
}

@media (max-width: 480px) {
    .app-container {
        width: 100vw;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        border: none;
    }
}
</style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-title">
            <h1>Vacanța de vară 2026</h1>
            <p>Colecția zilelor deosebite și însorite</p>
        </div>
        <button class="btn" onclick="openModal()">
            <span>➕</span> Adaugă memorii frumoase
        </button>
    </header>

    <div class="content-scroll">
        <div class="gallery-grid" id="galleryGrid">
            <!-- Memories injected dynamically -->
        </div>
    </div>
</div>

<div class="modal-backdrop" id="memoryModal">
    <div class="modal">
        <h2>Adaugă</h2>
        <form id="memoryForm" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label for="imageInput">Poză (Upload or Image URL)</label>
                <input type="file" id="imageFileInput" class="form-control" accept="image/*" style="margin-bottom: 0.5rem;" onchange="handleImageUpload(event)">
                <input type="text" id="imageInput" class="form-control" placeholder="Or paste image URL here..." required>
            </div>
            <div class="form-group">
                <label for="locationInput">Locație</label>
                <input type="text" id="locationInput" class="form-control" placeholder="e.g., Lake Como, Italy" required>
            </div>
            <div class="form-group">
                <label for="descInput">Descriere</label>
                <textarea id="descInput" class="form-control" placeholder="What made this moment special?" required></textarea>
            </div>
            <div class="form-group">
                <label for="dateInput">Data</label>
                <input type="text" id="dateInput" class="form-control" placeholder="e.g., Late August 2023" required>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn">Save Memory</button>
            </div>
        </form>
    </div>
</div>

<script>
const APP_STORAGE_KEY = 'summer_vacation_journal_app';
window.APP_STORAGE_KEY = APP_STORAGE_KEY;

let memories = [];
let uploadedImageBase64 = '';

const defaultMemories = [
    {
        id: 1,
        image: '1000049274.jpg',
        location: 'Domnești, România',
        description: 'Producție proprie',
        date: 'Iulie 2026-August 2026'
    },
    {
        id: 2,
        image: '1000050622.heic',
        location: 'Plimbări',
        description: 'București, parcuri...',
        date: 'Iunie-Iulie 2026'
    }
];

document.body.addEventListener('dblclick', function(event) {
    event.preventDefault();
});

function loadData() {
    const saved = localStorage.getItem(APP_STORAGE_KEY + '_data');
    if (saved) {
        try {
            memories = JSON.parse(saved);
        } catch (e) {
            memories = defaultMemories;
        }
    } else {
        memories = defaultMemories;
        saveData();
    }
    renderGallery();
}

function saveData() {
    localStorage.setItem(APP_STORAGE_KEY + '_data', JSON.stringify(memories));
}

function renderGallery() {
    const grid = document.getElementById('galleryGrid');
    grid.innerHTML = '';

    if (memories.length === 0) {
        grid.innerHTML = `
            <div class="empty-state">
                <span>🌻</span>
                <p>Nimic aici, încă...<br>Click "Adaugă memorie"</p>
            </div>
        `;
        return;
    }

    memories.forEach(mem => {
        const card = document.createElement('div');
        card.className = 'polaroid';
        card.innerHTML = `
            <button class="delete-btn" onclick="deleteMemory(${mem.id})" title="Delete">×</button>
            <div class="polaroid-img-container">
                <img src="${mem.image}" alt="${mem.location}" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'polaroid-placeholder\'>🖼️</div>';">
            </div>
            <div class="polaroid-caption">
                <div class="location-tag">📍 ${escapeHtml(mem.location)}</div>
                <div class="memory-desc">${escapeHtml(mem.description)}</div>
                <div class="memory-date">${escapeHtml(mem.date)}</div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function openModal() {
    document.getElementById('memoryModal').classList.add('active');
    document.getElementById('dateInput').value = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

function closeModal() {
    document.getElementById('memoryModal').classList.remove('active');
    document.getElementById('memoryForm').reset();
    uploadedImageBase64 = '';
}

function handleImageUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            uploadedImageBase64 = e.target.result;
            document.getElementById('imageInput').value = '[Uploaded Image Selected]';
            document.getElementById('imageInput').disabled = true;
        }
        reader.readAsDataURL(file);
    }
}

function handleFormSubmit(event) {
    event.preventDefault();
    
    const imageUrl = uploadedImageBase64 || document.getElementById('imageInput').value.trim();
    const location = document.getElementById('locationInput').value.trim();
    const description = document.getElementById('descInput').value.trim();
    const date = document.getElementById('dateInput').value.trim();

    if (!imageUrl || !location || !description) return;

    const newMemory = {
        id: Date.now(),
        image: imageUrl,
        location: location,
        description: description,
        date: date || 'Summer'
    };

    memories.unshift(newMemory);
    saveData();
    renderGallery();
    closeModal();
    document.getElementById('imageInput').disabled = false;
}

function deleteMemory(id) {
    memories = memories.filter(m => m.id !== id);
    saveData();
    renderGallery();
}

function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

window.addEventListener('load', loadData);


// Android WebView focus crash prevention
document.addEventListener("focusin", function(e) {
    if (e.target.tagName === "INPUT" && (e.target.type === "time" || e.target.type === "date" || e.target.type === "datetime-local")) {
        setTimeout(() => e.target.blur(), 100);
    }
});

// Time picker functionality for Android compatibility
function showTimePicker(inputId) {
    const input = document.getElementById(inputId);
    if (!input) return;
    
    input.blur();
    document.activeElement.blur();
    
    // Simple time picker using prompt (can be enhanced with custom modal)
    const currentTime = input.value || "12:00";
    const newTime = prompt("Enter time (HH:MM):", currentTime);
    
    if (newTime && /^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$/.test(newTime)) {
        input.value = newTime;
        input.dispatchEvent(new Event('change', { bubbles: true }));
    }
}

// Date picker functionality for Android compatibility  
function showDatePicker(inputId) {
    const input = document.getElementById(inputId);
    if (!input) return;
    
    input.blur();
    document.activeElement.blur();
    
    // Simple date picker using prompt (can be enhanced with custom modal)
    const currentDate = input.value || new Date().toISOString().split('T')[0];
    const newDate = prompt("Enter date (YYYY-MM-DD):", currentDate);
    
    if (newDate && /^\d{4}-\d{2}-\d{2}$/.test(newDate)) {
        input.value = newDate;
        input.dispatchEvent(new Event('change', { bubbles: true }));
    }
}
</script>

</body>
</html>
